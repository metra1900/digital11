<form>
  <label for="name">Your name</label>
  <input id="name" name="name"
         type="text" required>
  <label for="email">Email</label>							
  <input id="email" name="email"
         type="email" required>
  <button type="submit">Join</button>
</form>

<form> 
   <label for="name">Your name</label>
  <input id="name" name="name"
         type="text" placeholder="Your Name"
         autocomplete="name" required>
<label for="email">Email</label> 
<input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
<button type="submit">Join</button> 
</form>
  <style>
        body {
            background-color: #eef3f8;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        
        form {
            background-color: white;
            width: 350px;
            margin: 80px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        form h2 {
            text-align: center;
            color: #1e3a5f;
            margin-bottom: 25px;
        }

     
        label {
            display: block;
            font-size: 15px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

       
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 15px;
            box-sizing: border-box;
        }

     
        input:focus {
            outline: none;
            border: 2px solid #2474c6;
        }

      
        button {
            width: 100%;
            padding: 13px;
            background-color: #2474c6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background-color: #15528f;
        }

    </style>
